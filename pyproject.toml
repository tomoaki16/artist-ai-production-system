[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-ai-production-system"
version = "0.1.0"
description = "Artist-first, DAW-agnostic AI music production system"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "librosa>=1.0,<1.1"]

[project.scripts]
aips = "aips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
